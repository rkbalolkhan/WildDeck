services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override so the bot reaches the compose-internal database.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uno}:${POSTGRES_PASSWORD:-uno}@postgres:5432/${POSTGRES_DB:-uno}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BOT_WEBHOOK_PORT:-8080}:${BOT_WEBHOOK_PORT:-8080}"
    networks: [uno]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uno}
      POSTGRES_DB: ${POSTGRES_DB:-uno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [uno]

  # Optional: docker compose --profile redis up
  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [uno]

volumes:
  postgres_data:

networks:
  uno:
